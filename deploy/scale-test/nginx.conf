worker_processes auto;
events { worker_connections 8192; }

http {
  # WebSocket upgrade header
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # SockJS stickiness: /ws/{server}/{session}/... hashes on the session id so every frame of one
  # SockJS session reaches the same instance; everything else spreads by request id.
  map $uri $sockjs_session {
    ~^/ws/[^/]+/([^/]+)/ $1;
    default $request_id;
  }

  upstream springapp {
    hash $sockjs_session consistent;
    server springapp-a:8080 max_fails=0;
    server springapp-b:8080 max_fails=0;
  }

  server {
    listen 8080;
    client_max_body_size 2m;

    location / {
      proxy_pass http://springapp;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
  }
}
