# Local 2-instance scale-test environment. Placeholder secrets only; never use real values here.
# Build:  docker compose -f deploy/scale-test/docker-compose.yml build
# Run:    docker compose -f deploy/scale-test/docker-compose.yml up -d   (owner's machine only)
# Entry point for load: http://localhost:8080 (nginx in front of instances a and b).

x-springapp: &springapp
  build:
    context: ../../springapp
    dockerfile: ../deploy/scale-test/springapp.Dockerfile
  image: vantage-scale-test/springapp:local
  mem_limit: 1g
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    elasticmq:
      condition: service_started
    catalog:
      condition: service_started
    stub-judge:
      condition: service_started
  environment: &springapp-env
    TZ: UTC
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vantage?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    SPRING_DATASOURCE_USERNAME: root
    SPRING_DATASOURCE_PASSWORD: local-only-change-me
    SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
    SPRING_JPA_HIBERNATE_DDL_AUTO: update
    JWT_SECRET: local-only-change-me-local-only-change-me
    CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
    AUTH_COOKIE_SECURE: "false"
    JUDGE_BASE_URL: http://stub-judge:9000
    JUDGE_TOKEN: local-only-change-me
    CATALOG_BASE_URL: http://catalog:3001
    # Redis realtime bridge
    VANTAGE_REALTIME_REDIS_ENABLED: "true"
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: "6379"
    # SQS (ElasticMQ) judge queue
    VANTAGE_JUDGE_QUEUE_ENABLED: "true"
    VANTAGE_JUDGE_QUEUE_URL: http://elasticmq:9324/000000000000/vantage-judge
    VANTAGE_JUDGE_QUEUE_ENDPOINT: http://elasticmq:9324
    VANTAGE_JUDGE_QUEUE_REGION: ap-south-1
    AWS_ACCESS_KEY_ID: local-only-change-me
    AWS_SECRET_ACCESS_KEY: local-only-change-me
    AWS_REGION: ap-south-1
    VANTAGE_ADMIN_TOKEN: local-only-change-me
    BATTLE_CONTINUEAFTERFIRSTFINISHER_ENABLED: "true"
    BATTLE_CUSTOMTIMER1V1_ENABLED: "true"

services:
  mysql:
    image: mysql:8.0.40
    command: ["--max-connections=500", "--character-set-server=utf8mb4", "--default-time-zone=+00:00"]
    environment:
      MYSQL_ROOT_PASSWORD: local-only-change-me
      MYSQL_DATABASE: vantage
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -plocal-only-change-me --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro

  catalog:
    build:
      context: ../../judge
      dockerfile: Dockerfile.catalog
    image: vantage-scale-test/catalog:local
    environment:
      JUDGE_TOKEN: local-only-change-me
      PORT: "3001"

  stub-judge:
    build:
      context: ../../loadtest/stub-judge
    image: vantage-scale-test/stub-judge:local
    environment:
      PORT: "9000"
      STUB_DELAY_MS: "1500"
      STUB_FAIL_RATE: "0"

  springapp-a:
    <<: *springapp
    environment:
      <<: *springapp-env
      VANTAGE_INSTANCE_ID: a

  springapp-b:
    <<: *springapp
    environment:
      <<: *springapp-env
      VANTAGE_INSTANCE_ID: b

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - springapp-a
      - springapp-b
