# One clock for the whole app. The JVM default zone is pinned to UTC in SpringappApplication.main (and TZ=UTC /
# -Duser.timezone=UTC in the images); these pin the database side so NOW(3) and LocalDateTime.now() are in the same zone
# whatever zone the host or the MySQL server is configured in (an ap-south-1 box or RDS defaults can be IST or UTC).
# Loaded through config/TimeConfig (application.properties is gitignored); application.properties and env vars win.

# Every pooled connection runs in UTC. A numeric offset needs no time-zone tables on the server.
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Startup guard (config/TimeConsistencyCheck): refuse to start when the DB clock and the JVM clock differ by more than this.
# A zone mismatch is hours; normal NTP skew is milliseconds.
vantage.time.max-skew-seconds=60
vantage.time.enforce=true
